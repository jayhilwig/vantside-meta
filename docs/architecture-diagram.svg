<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="765" viewBox="0 0 1200 765" role="img" aria-labelledby="title desc">
<title id="title">VantSide Meta architecture</title><desc id="desc">Four steps: resume and career conversation, job opportunity, practice interview, and live HUD. Meta Muse Spark analyzes career facts; Baseten offers optional job analysis. OpenAI GPT-Live conducts spoken practice. SQLite stores approved Career Memory. TypeSafe AI Jev decides whether to surface matching approved facts on the movable HUD.</desc>
