<title id="title">VantSide Career Memory architecture and service workflow</title>
<desc id="desc">VantSide desktop creates approved Career Memory from resume and conversation using Meta Muse Spark and local SQLite, analyzes opportunity requirements with Meta or optional Baseten, and uses OpenAI GPT-Live for practice and TypeSafe AI Jev for whether to show contextual HUD cues.</desc>
