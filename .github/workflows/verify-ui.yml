name: Validate VantSide changes

on:
  push:
    branches:
      - ui/collapse-interview-evidence-2026-11-09
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Interview timer tests
        run: node --import tsx --test src/lib/interview-timing.test.ts
      - name: Static frontend build
        run: npm run build
