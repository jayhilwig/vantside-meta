[package]
name = "vantside_meta"
version = "0.1.0"
description = "VantSide Meta practice desktop shell"
license = "MIT"
repository = "https://github.com/jayhilwig/vantside-meta"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "vantside_meta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "=0.17.3"
windows = { version = "=0.61.3", features = ["Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
